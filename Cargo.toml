[package]
name = "hexium-client"
version = "0.1.0"
edition = "2021"
description = "Third-party desktop client for hexium.wtf, built on the site's /apisite proxy"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
notify-rust = "4"
raw-window-handle = "0.6"

# Same version notify-rust already pulls in; only the features for the Start-menu shortcut.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

# Images are decoded constantly; a little optimization in dev builds keeps the UI responsive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
